<style>:root{--ink:#122033;--muted:#667085;--line:#e6e9ef;--paper:#fbfbfa;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 48px));margin:auto}.nav{background:#fff;border-bottom:1px solid var(--line)}.navin{min-height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:.04em}.back{color:var(--blue);font-weight:800;font-size:14px;text-decoration:none}.hero{padding:52px 0 30px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--blue)}h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.05em;margin:10px 0}p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:34px 0 64px}.item{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.item figcaption{padding:10px 12px;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{width:min(100% - 32px,1180px)}.grid{grid-template-columns:1fr}}</style>
</head>
<body>

<header class="nav">
<div class="wrap navin">

<section class="hero">

</div>
</section>
<div class="wrap">
<div class="grid" id="evidenceGrid">
</div>
</div>
</main><script>const base='assets/evidence/';const files=['Priyadarshini Public School.png','Priyadarshini Public School 2.png','Priyadrshini Public School Custom Audience.png','Priyadrshini Public School Custom Audience 1 Setup 1.png','Priyadrshini Public School Custom Audience 1 Setup 1.png','Priyadrshini Public School Custom Audience 1 Setup 2.png','Priyadrshini Public School Custom Audience 2 Setup.png'];for(let i=1;i<=20;i++)files.push('Priyadrshini Public School Campaing Setup '+i+'.png');document.getElementById('evidenceGrid').innerHTML=files.map((file,index)=>'<figure class="item"><img loading="lazy" src="'+base+file+'" alt="Priyadarshini Public School evidence '+(index+1)+'"><figcaption>Supplied campaign evidence '+(index+1)+'</figcaption></figure>').join('');const modal=document.createElement('div');modal.className='evidence-modal';modal.innerHTML='<div class="evidence-dialog"><button class="evidence-close" aria-label="Close evidence">×</button><img alt="Expanded Priyadarshini Public School evidence"><p>Supplied campaign evidence</p></div>';document.body.appendChild(modal);const image=modal.querySelector('img');const close=()=>modal.classList.remove('open');document.querySelectorAll('.item img').forEach(img=>img.addEventListener('click',()=>{image.src=img.src;image.alt=img.alt;modal.classList.add('open')}));modal.querySelector('button').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></body>
